name: Build and deploy React projects

on:
  push:
    branches: [main]
    paths:
      - projects.json
      - scripts/**
      - .github/workflows/**
  schedule:
    - cron: "17 * * * *"   # hourly: picks up code changes in the source repos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build projects
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: node scripts/build.mjs

      - name: Commit and push site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "Deploy React projects"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
